# ansible.cfg
# vim: set tabstop=4 shiftwidth=4 expandtab:

# Repository-local Ansible settings. bin/run-playbook.sh cd's here before
# exec'ing ansible-playbook, so every wrapper picks these up.
#
# Ansible reads exactly one config file -- the first of $ANSIBLE_CONFIG,
# ./ansible.cfg, ~/.ansible.cfg, /etc/ansible/ansible.cfg -- so settings are
# not merged. Keep this file to things that are true for this repository only.

[defaults]
# Every playbook here targets localhost and sets gather_facts explicitly; this
# stops a stray play from paying for a fact gather it does not read.
gathering = explicit

# The playbooks run against the implicit localhost on purpose. The two warnings
# about a missing inventory are noise on every single run.
localhost_warning = False
inventory_unparsed_warning = False

# Migrations are long and resumable through -e resume_run_id=...; a .retry file
# beside the playbook is never the way a run is picked back up.
retry_files_enabled = False

# Use the discovered Python interpreter without printing the discovery warning.
interpreter_python = auto_silent
