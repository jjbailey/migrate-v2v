    <circle cx="251" cy="590" r="3" fill="#E4AD3A"/>
    <text x="272" y="596" fill="#9EB5BA" font-size="16" font-weight="600" letter-spacing="1.3">AWS · AZURE · OPENSTACK · GOOGLE CLOUD</text>

    <rect x="870" y="153" width="590" height="594" rx="30" fill="url(#panel)" stroke="#31545A" stroke-width="1.5"/>
    <text x="916" y="207" fill="#9EB5BA" font-size="13" font-weight="700" letter-spacing="2.6">MIGRATION PATH</text>

