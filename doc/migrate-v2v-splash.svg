<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">migrate-v2v</title>
  <desc id="description">A vSphere virtual machine migration path branching to AWS, Azure, OpenStack, and Google Cloud. Snapshot safely. Export or stream. Land natively.</desc>
  <defs>
