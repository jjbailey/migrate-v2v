      <stop offset="0" stop-color="#193B43"/>
      <stop offset="1" stop-color="#15343C"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#D6E1E2" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="#122D35"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1495" cy="35" r="320" fill="#087E82" opacity=".09"/>
  <circle cx="48" cy="866" r="280" fill="#3978A8" opacity=".08"/>

