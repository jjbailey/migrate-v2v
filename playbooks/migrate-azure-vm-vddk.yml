---
# playbooks/migrate-azure-vm-vddk.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Migrates one vSphere VM to Azure by streaming its disks straight from the
# datastore, with no clone and no OVF export. By default the disks are read
# through VixDiskLib (nbdkit's vddk plugin); without that library the flat
# disk files are read from vCenter's /folder endpoint (nbdkit's curl plugin).
# qemu-img writes each stream as the fixed VHD Azure requires, which is staged
# as a page blob and registered as a managed image. A snapshot freezes the
# source disks and stays in place as the resume checkpoint until every disk
# has its image. Counterpart of migrate-azure-vm.yml, which is untouched; see
# doc/datastore-direct.md.

- name: Migrate a vSphere VM to Azure
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/migration-common.yml

  vars:
    migration_target: azure
    export_format: datastore
    resume_run_id: ""
    # Discard a failed run instead of resuming it: removes its retained
    # snapshot, its run directory, and any blobs and images it created.
    # Nothing else runs.
    discard_run_id: ""
    artifact_root: "/work/migrate-v2v"
    qemu_img_bin: qemu-img
    # Extra qemu-img convert arguments. -m keeps several coroutines in flight
    # and -W lets them write out of order, which a default single-threaded
    # conversion cannot do.
    azure_convert_args: ["-m", "16", "-W"]
    # Conversions run in the background so they can overlap the previous
    # disk's upload; these bound how long one may take.
    azure_convert_async_timeout: 86400
    azure_convert_poll_retries: 2880
    azure_convert_poll_delay: 30
    # Blob container the VHDs are staged in (an azure_projects entry may set
    # storage_container instead). Created when missing by the first upload.
    azure_storage_container: "migrate-v2v-images"
    # A same-named managed image is replaced so reruns publish the current
    # artifact; the resource ID is derived from the name, so it stays stable
    # across runs while its content changes - like GCP.
    azure_replace_existing_image: true
    azure_image_lookup_retries: 20
    azure_image_lookup_delay: 3
    # V1 (BIOS) or V2 (UEFI). Empty follows the source VM's firmware, read
    # from the artifact manifest; set V1 or V2 to override it.
    azure_hyper_v_generation: ""
    # Datastore-direct settings, shared with migrate-openstack-vm-vddk.yml.
    vddk_nbdkit_bin: nbdkit
    # How disks are read: vddk (VixDiskLib through nbdkit's vddk plugin), curl
    # (flat files from vCenter's /folder endpoint), or auto (vddk when the
    # plugin and library load, else curl).
    vddk_backend: auto
    # VixDiskLib directory holding lib64/libvixDiskLib.so.8; empty uses the
    # vddk plugin's built-in default.
    vddk_libdir: ""
    # VixDiskLib transports to try, colon-separated.
    vddk_transports: nbdssl
    # vCenter certificate SHA-1 thumbprint; empty reads it in preflight.
    vddk_thumbprint: ""
    # PEM file of the CA that issued the vCenter certificate, for a vCenter this
    # host does not already trust: curl gets it as cainfo=, and the thumbprint
    # check verifies against it. Empty uses the host's trust store.
    vddk_ca_bundle: ""
    # A full copy of a snapshot does not need Changed Block Tracking. Set true
    # to insist on it (a baseline for future incremental runs).
    vddk_require_cbt: false
    # Read a local file instead of connecting to vCenter. Test use only.
    vddk_local: false

  tasks:
    - name: Refuse a discard combined with a resume
      ansible.builtin.assert:
        that: not (discard_run_id | length > 0 and resume_run_id | length > 0)
        fail_msg: Pass either -e resume_run_id or -e discard_run_id, not both.

    - name: Turn a discard request into a cleanup-only resume of that run
      ansible.builtin.set_fact:
        resume_run_id: "{{ discard_run_id }}"
        discard_failed_artifacts: true
        migration_discard_only: true
      when: discard_run_id | length > 0

    - name: Record that this is a normal run
      ansible.builtin.set_fact:
        migration_discard_only: false
      when: discard_run_id | length == 0

    - name: Run shared VMware preflight checks
      ansible.builtin.import_tasks: tasks/migration/common/preflight-vddk.yml

    - name: Run Azure preflight checks
      ansible.builtin.import_tasks: tasks/migration/azure/preflight-vddk.yml

    - name: Initialize the Azure migration
      ansible.builtin.import_tasks: tasks/migration/azure/initialize.yml

    - name: Stop disk streams a killed earlier attempt of this run left running
      ansible.builtin.import_tasks: tasks/migration/common/stop-streams-vddk.yml
      when: migration_resume_mode | bool

    - name: Execute the Azure migration
      block:
        - name: Validate requested resume artifacts
          ansible.builtin.import_tasks: tasks/migration/common/resume-vddk.yml

        - name: Find what the discarded run left in Azure
          ansible.builtin.import_tasks: tasks/migration/azure/discard-vddk.yml
          when: migration_discard_only | bool

        - name: Snapshot the source VM and inspect its disks
          ansible.builtin.import_tasks: tasks/migration/common/prepare-source-manifest.yml
          when: not (migration_resume_mode | bool)

        - name: Prepare Azure disk artifacts
          ansible.builtin.import_tasks: tasks/migration/azure/prepare-disks.yml
          when: not (migration_discard_only | bool)

        - name: Import disks into Azure
          ansible.builtin.import_tasks: tasks/migration/azure/import.yml
          when: not (migration_discard_only | bool)

        - name: Build the Azure catalog entry
          ansible.builtin.import_tasks: tasks/migration/azure/build-catalog-entry.yml
          when: not (migration_discard_only | bool)

        - name: Append the migration catalog entry
          ansible.builtin.import_tasks: tasks/migration/common/append-catalog.yml
          when: not (migration_discard_only | bool)

        # Reached only when every discard lookup above succeeded; the
        # discard report in common/cleanup-vddk.yml relies on it, since an
        # always: section cannot see which task failed.
        - name: Mark the discard lookups complete
          ansible.builtin.set_fact:
            discard_lookup_complete: true
          when: migration_discard_only | bool

      always:
        - name: Stop disk streams still running after a failure
          ansible.builtin.import_tasks: tasks/migration/common/stop-streams-vddk.yml

        - name: Clean up Azure resources
          ansible.builtin.import_tasks: tasks/migration/azure/cleanup.yml

        - name: Clean up shared migration resources
          ansible.builtin.import_tasks: tasks/migration/common/cleanup-vddk.yml

