---
# playbooks/tasks/launch-gcp-data-disk-attach.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Attach one data disk (gcp_data_disk_spec, made by
# tasks/launch-gcp-data-disk-create.yml) to an instance that already exists.
# A new instance was created with the disk (--disk), so this finds it attached
# and does nothing; it matters when an earlier run left the instance behind
# without some of its disks.

- name: Use the GCP data disk from the spec
  ansible.builtin.set_fact:
    gcp_data_disk_name: "{{ gcp_data_disk_spec.name }}"
    gcp_data_device_name: "{{ gcp_data_disk_spec.device }}"

- name: Check whether the GCP data disk is already attached
  ansible.builtin.command:
    argv:
      - gcloud
      - compute
      - instances
      - describe
      - "{{ gcp_instance_name }}"
      - "--zone={{ gcp_zone }}"
      - "--project={{ gcp_project }}"
      # value(disks[].deviceName) prints every name on one ;-joined line, so
      # read the disks as JSON and compare whole names instead.
      - "--format=json(disks)"
  environment: "{{ gcp_gcloud_env }}"
  register: gcp_attached_disks
  changed_when: false

- name: Refuse a different disk at the expected device name
  ansible.builtin.assert:
    that:
      - >-
        ((gcp_attached_disks.stdout | from_json).disks | default([], true)
         | selectattr('deviceName', 'equalto', gcp_data_device_name)
         | map(attribute='source') | map('regex_replace', '^.*/', '') | list)
        in [[], [gcp_data_disk_name]]
    fail_msg: >-
      Instance {{ gcp_instance_name }} already has a different disk at
      device {{ gcp_data_device_name }}.

- name: Attach the GCP data disk
  ansible.builtin.command:
    argv:
      - gcloud
      - compute
      - instances
      - attach-disk
      - "{{ gcp_instance_name }}"
      - "--disk={{ gcp_data_disk_name }}"
      - "--device-name={{ gcp_data_device_name }}"
      - "--zone={{ gcp_zone }}"
      - "--project={{ gcp_project }}"
      - --quiet
  environment: "{{ gcp_gcloud_env }}"
  when: >-
    gcp_data_device_name not in
    ((gcp_attached_disks.stdout | from_json).disks | default([], true)
     | map(attribute='deviceName') | list)
  changed_when: true

- name: Record the GCP data disk
  ansible.builtin.set_fact:
    gcp_data_disk_names: "{{ gcp_data_disk_names + [gcp_data_disk_name] }}"

