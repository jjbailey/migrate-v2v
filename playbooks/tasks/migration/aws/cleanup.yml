---
# playbooks/tasks/migration/aws/cleanup.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Best-effort cleanup for AWS-owned artifacts.

- name: Cancel an unfinished AWS import task
  amazon.aws.ec2_import_image:
    state: absent
    task_name: "{{ clone_name }}"
    cancel_reason: "migrate-aws-vm.yml failed"
    region: "{{ aws_region }}"
  when:
    - aws_import_cleanup_required | default(false) | bool
  failed_when: false

# AWS runs do not resume, so an AMI from a run that failed after its import
# (see import.yml) is never cataloged; it is removed with its snapshots.
- name: Deregister the AMI of a failed run and delete its snapshots
  amazon.aws.ec2_ami:
    image_id: "{{ aws_imported_ami_id }}"
    state: absent
    delete_snapshot: true
    region: "{{ aws_region }}"
  register: aws_ami_cleanup
  when:
    - aws_imported_ami_id | default('') | length > 0
    - not (migration_succeeded | default(false) | bool)
  # ignore_errors, not failed_when: false, so .failed survives for the report.
  ignore_errors: true

- name: Report an AMI that could not be removed
  ansible.builtin.debug:
    msg: >-
      Could not deregister {{ aws_imported_ami_id }} or delete its snapshots
      in {{ aws_region }}: {{ aws_ami_cleanup.msg | default('no detail') }}.
      Remove them by hand; no catalog row refers to them.
  when:
    - aws_ami_cleanup is defined
    - aws_ami_cleanup is not skipped
    - aws_ami_cleanup.failed | default(false) | bool

- name: Remove the staged OVA from S3
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket }}"
    object: "{{ s3_key }}"
    mode: delobj
    region: "{{ aws_region }}"
  when:
    - ova_upload is defined and ova_upload is succeeded
    - (migration_succeeded | default(false) | bool) or (discard_failed_artifacts | bool)
  failed_when: false

- name: Report a retained AWS import artifact
  ansible.builtin.debug:
    msg: >-
      Migration did not complete. The staged OVA was retained at
      s3://{{ s3_bucket }}/{{ s3_key }} for a manual or follow-up import.
      Set -e discard_failed_artifacts=true to delete it on failure.
  when:
    - ova_upload is defined and ova_upload is succeeded
    - not (migration_succeeded | default(false) | bool)
    - not (discard_failed_artifacts | bool)

- name: Remove the local OVA
  ansible.builtin.file:
    path: "{{ ova_local_path }}"
    state: absent
  failed_when: false

- name: Remove the empty local AWS artifact directory
  ansible.builtin.command:
    argv:
      - rmdir
      - "{{ aws_migration_run_dir }}"
  changed_when: aws_artifact_directory_cleanup.rc == 0
  failed_when: false
  register: aws_artifact_directory_cleanup
  when:
    # Only the per-run directory this play derived is ours to remove. An
    # operator-supplied migration_run_dir is theirs and stays put.
    - migration_run_dir is not defined

