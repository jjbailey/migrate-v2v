---
# playbooks/tasks/migration/gcp/preflight.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# GCP credentials and prerequisites.

- name: Select the GCP project for this run
  ansible.builtin.import_tasks: select-project.yml

- name: Ensure the GCP Cloud CLI is available
  ansible.builtin.import_tasks: ensure-gcloud.yml

- name: Check the Migrate to Virtual Machines image-import command
  # The same command group start-import.yml and finish-import.yml run.
  ansible.builtin.command:
    argv:
      - gcloud
      - compute
      - migration
      - image-imports
      - --help
  register: gcp_image_import_command_check
  environment: "{{ gcp_gcloud_env }}"
  failed_when: gcp_image_import_command_check.rc != 0
  changed_when: false

- name: Confirm the GCS staging bucket is accessible
  # List only the bucket's top-level entries. This uses the object-list
  # permission already needed by staging and fails before snapshot/export if
  # the bucket is missing or inaccessible.
  ansible.builtin.command:
    argv:
      - gcloud
      - storage
      - ls
      - "gs://{{ gcs_bucket }}/"
      - "--project={{ gcp_project }}"
  environment: "{{ gcp_gcloud_env }}"
  register: gcp_staging_bucket_check
  failed_when: gcp_staging_bucket_check.rc != 0
  changed_when: false

