---
# playbooks/tasks/migration/azure/cleanup.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Best-effort cleanup for Azure-owned artifacts. A managed image or snapshot
# holds its own copy of the disk, so the staged VHD blobs are removed once the
# run succeeded (or was explicitly discarded); a failed run keeps them so a
# resume can reuse them, like the GCS staging objects. Images and snapshots
# are only removed on an explicit discard of a failed run.

# A failed upload can leave the next disk's conversion running in the
# background (import-disk.yml starts it before uploading). Wait for every
# conversion to end before cleanup or a resume touches the same staging files,
# as openstack/cleanup.yml does; the datastore-direct method stops its streams
# first (stop-streams-vddk.yml), so its conversions end at once.
- name: Wait for background disk conversions to end
  ansible.builtin.async_status:
    jid: "{{ item.value }}"
  register: azure_convert_drain
  until: azure_convert_drain.finished | bool
  retries: "{{ azure_convert_poll_retries | int }}"
  delay: "{{ azure_convert_poll_delay | int }}"
  loop: "{{ azure_convert_jobs | default({}) | dict2items }}"
  loop_control:
    label: "disk {{ item.key }}"
  when: not (migration_succeeded | default(false) | bool)
  failed_when: false

- name: Clean up Azure resources
  module_defaults:
    group/azure.azcollection.all: "{{ azure_module_defaults | default({}) }}"
  block:
    - name: Remove staged VHD blobs from Azure Blob Storage
      azure.azcollection.azure_rm_storageblob:
        resource_group: "{{ azure_resource_group | default('') }}"
        storage_account_name: "{{ azure_storage_account | default('') }}"
        container: "{{ azure_storage_container | default('') }}"
        blob: "{{ item }}"
        state: absent
      loop: "{{ azure_blob_names | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: (migration_succeeded | default(false) | bool) or (discard_failed_artifacts | bool)
      register: azure_blob_remove
      # ignore_errors rather than failed_when: false, so a discard can count
      # each blob it could not remove (below). After a successful migration
      # a leftover blob is only reported.
      ignore_errors: true

    - name: Report staged VHD blobs that could not be removed
      ansible.builtin.debug:
        msg: >-
          Removing blob {{ item.item }} did not succeed; check container
          {{ azure_storage_container }} and remove it manually. Detail:
          {{ item.msg | default('(none reported)') }}
      loop: "{{ azure_blob_remove.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - (migration_succeeded | default(false) | bool) or (discard_failed_artifacts | bool)
        - item.failed | default(false) | bool or (item.msg | default('') | length > 0)

    - name: Report retained VHD blobs for a failed run
      ansible.builtin.debug:
        msg: >-
          Migration did not complete. Staged blobs were retained in container
          {{ azure_storage_container }} under {{ azure_blob_prefix | default('') }}
          for debugging; a resume re-uploads or reuses them.
      when:
        - azure_blob_names | default([]) | length > 0
        - not (migration_succeeded | default(false) | bool)
        - not (discard_failed_artifacts | bool)

    # A resumed run reuses images and snapshots an earlier attempt created
    # (azure_reused_*_names); a discard removes those along with this
    # attempt's.
    - name: Remove managed images created by this failed run
      azure.azcollection.azure_rm_image:
        resource_group: "{{ azure_resource_group | default('') }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ (azure_created_image_names | default([])) | union(azure_reused_image_names | default([])) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - not (migration_succeeded | default(false) | bool)
        - discard_failed_artifacts | bool
      # ignore_errors rather than failed_when: false, so each item keeps its
      # real failed flag for the report below and common/cleanup-vddk.yml.
      ignore_errors: true
      register: azure_image_remove

    - name: Remove data snapshots created by this failed run
      azure.azcollection.azure_rm_snapshot:
        resource_group: "{{ azure_resource_group | default('') }}"
        name: "{{ item }}"
        state: absent
      loop: "{{ (azure_created_snapshot_names | default([])) | union(azure_reused_snapshot_names | default([])) }}"
      loop_control:
        label: "{{ item }}"
      when:
        - not (migration_succeeded | default(false) | bool)
        - discard_failed_artifacts | bool
      ignore_errors: true
      register: azure_snapshot_remove

    - name: Record which blobs, images and snapshots the discard removed
      vars:
        azure_blob_results: "{{ azure_blob_remove.results | default([]) }}"
        azure_image_results: "{{ azure_image_remove.results | default([]) }}"
        azure_snapshot_results: "{{ azure_snapshot_remove.results | default([]) }}"
      ansible.builtin.set_fact:
        discard_removed_artifacts: >-
          {{ discard_removed_artifacts | default([])
             + (azure_blob_results | rejectattr('skipped', 'defined') | rejectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'blob ') | list)
             + (azure_image_results | rejectattr('skipped', 'defined') | rejectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'image ') | list)
             + (azure_snapshot_results | rejectattr('skipped', 'defined') | rejectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'snapshot ') | list) }}
        discard_unremoved_artifacts: >-
          {{ discard_unremoved_artifacts | default([])
             + (azure_blob_results | selectattr('failed', 'defined') | selectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'blob ') | list)
             + (azure_image_results | selectattr('failed', 'defined') | selectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'image ') | list)
             + (azure_snapshot_results | selectattr('failed', 'defined') | selectattr('failed')
                | map(attribute='item') | map('regex_replace', '^', 'snapshot ') | list) }}
      when:
        - not (migration_succeeded | default(false) | bool)
        - discard_failed_artifacts | bool

    - name: Report images and snapshots the discard could not remove
      ansible.builtin.debug:
        msg: >-
          Could not remove {{ item }} in resource group {{ azure_resource_group }};
          remove it manually or rerun the discard.
      loop: "{{ discard_unremoved_artifacts | default([]) | select('match', '^(image|snapshot) ') | list }}"
      when:
        - not (migration_succeeded | default(false) | bool)
        - discard_failed_artifacts | bool

