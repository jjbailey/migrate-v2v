---
# playbooks/tasks/migration/openstack/preflight-vddk.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# OpenStack credentials and prerequisites for the datastore-direct path: the
# checks in preflight.yml plus the shared nbdkit and disk-backend checks in
# common/select-backend-vddk.yml.
#
# Supports many projects at once: $MIGRATE_V2V_VAULT_DIR/openstack.yml holds an
# openstack_projects mapping and one run selects a single project with
# -e openstack_target_project=<name>. A legacy vault holding only
# openstack_auth still works unmodified.

- name: Select the OpenStack project for this run
  ansible.builtin.import_tasks: select-project.yml

- name: Check qemu-img
  ansible.builtin.command: "{{ qemu_img_bin }} --version"
  register: qemu_img_check
  failed_when: qemu_img_check.rc != 0
  changed_when: false

- name: Check nbdkit and choose the disk backend
  ansible.builtin.import_tasks: ../common/select-backend-vddk.yml

- name: Set up guest conversion prerequisites
  ansible.builtin.import_tasks: guest-convert-setup-vddk.yml
  when: openstack_guest_convert | bool

- name: Check virt-v2v-in-place for guest conversion
  # Windows drivers (virtio-win) are checked once the source VM's guest OS is
  # known, before the snapshot: openstack/guest-convert-check-vddk.yml.
  ansible.builtin.command: virt-v2v-in-place --version
  register: virt_v2v_in_place_check
  failed_when: virt_v2v_in_place_check.rc != 0
  changed_when: false
  when: openstack_guest_convert | bool

