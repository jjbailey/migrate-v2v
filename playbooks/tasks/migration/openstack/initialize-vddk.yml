---
# playbooks/tasks/migration/openstack/initialize-vddk.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Stable OpenStack names, persistent paths, and lifecycle state for the
# datastore-direct path. A copy of initialize.yml: there is no clone and no OVF
# descriptor, and the migration snapshot is the resume checkpoint.

- name: Generate or reuse the OpenStack migration run ID
  ansible.builtin.set_fact:
    migration_run_id: >-
      {{ resume_run_id if (resume_run_id | length > 0) else lookup('pipe', 'python3 -c "import time; print(time.time_ns())"') }}
    migration_resume_mode: "{{ resume_run_id | length > 0 }}"
    migration_succeeded: false
    snapshot_cleanup_required: false
    openstack_uploaded_image_names: []
    openstack_image_ids: []
    openstack_image_names: []
    # Keyed by manifest disk index so the catalog lists can be rebuilt in disk
    # order regardless of which disks were converted in this run.
    openstack_disk_image_ids: {}
    openstack_pending_disks: []
    openstack_convert_jobs: {}

- name: Derive the persistent OpenStack run directory
  ansible.builtin.set_fact:
    migration_run_dir: >-
      {{ artifact_root }}/openstack/{{ vm_name | regex_replace('[^A-Za-z0-9_.-]', '_') }}/{{ migration_run_id }}

- name: Derive OpenStack migration names and paths
  ansible.builtin.set_fact:
    snapshot_name: "ansible-openstack-vddk-snap-{{ migration_run_id }}"
    # No clone VM exists on this path. The catalog and its readers (lookup,
    # launch, reconcile) still key every migration on clone_name, so keep it as
    # the migration's unique identifier. common/cleanup-vddk.yml never deletes it.
    clone_name: "{{ vm_name }}-openstack-vddk-{{ migration_run_id }}"
    artifact_manifest_path: "{{ migration_run_dir }}/artifact-manifest.json"
    openstack_staging_dir: "{{ migration_run_dir }}/disks"
    openstack_image_prefix: "{{ vm_name }}-migration-{{ migration_run_id }}"
    # Unix socket paths are limited to 107 bytes, which a long VM name in the
    # run directory could exceed, so the sockets get a short directory of their own.
    openstack_vddk_socket_dir: "/tmp/.vddk-{{ migration_run_id }}"
    catalog_entry_path: >-
      /tmp/.{{ vm_name }}-openstack-vddk-{{ migration_run_id }}.catalog-entry.json

- name: Create the persistent OpenStack run directory
  ansible.builtin.file:
    path: "{{ migration_run_dir }}"
    state: directory
    mode: "0700"

- name: Create the private NBD socket directory
  ansible.builtin.file:
    path: "{{ openstack_vddk_socket_dir }}"
    state: directory
    mode: "0700"

