---
# playbooks/tasks/migration/common/cleanup.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Best-effort cleanup shared by every target.

# The resumable run directory. Azure, GCP, and OpenStack always derive
# migration_run_dir and can resume from it, so it is removed on success or
# explicit discard, and otherwise kept with a resume hint. AWS does not resume:
# it defines migration_run_dir only when an operator supplies one, which is
# theirs and must not be deleted, and aws/cleanup.yml reports its retained S3
# object instead. These run first, the same point in the always: sequence as
# when they lived in each platform's cleanup.yml.
- name: Remove persistent artifacts after success or explicit discard
  ansible.builtin.file:
    path: "{{ migration_run_dir }}"
    state: absent
  when:
    - migration_target in ['azure', 'gcp', 'openstack']
    - (migration_succeeded | default(false) | bool) or (discard_failed_artifacts | bool)
    - migration_run_dir_derived | default(false) | bool
  failed_when: false

- name: Report retained artifacts for a resumable failed run
  ansible.builtin.debug:
    msg: >-
      Migration did not complete. Artifacts were retained at
      {{ migration_run_dir }}. Resume with
      -e resume_run_id={{ migration_run_id }} after correcting the failure.
  when:
    - migration_target in ['azure', 'gcp', 'openstack']
    - not (migration_succeeded | default(false) | bool)
    - not (discard_failed_artifacts | bool)

- name: Remove the temporary catalog entry
  ansible.builtin.file:
    path: "{{ catalog_entry_path }}"
    state: absent
  register: cleanup_catalog_entry
  # ignore_errors, not failed_when: false, so the warning below sees a failure.
  ignore_errors: true

- name: Remove the vSphere clone and snapshot unless this run already did
  ansible.builtin.import_tasks: cleanup-vsphere.yml
  when: not (vsphere_cleanup_done | default(false) | bool)

- name: Warn about a temporary catalog entry that was not removed
  ansible.builtin.debug:
    msg: >-
      Best-effort cleanup did not remove the temporary catalog entry
      {{ catalog_entry_path }}. Remove it manually.
  when: cleanup_catalog_entry.failed | default(false) | bool

