---
# playbooks/migrate-azure-vm.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:

# Migrates one vSphere VM to Azure. The shared VMware task pipeline creates a
# snapshot-backed clone and exports a validated OVF package; Azure-specific
# tasks convert each VMDK to the fixed VHD Azure requires, stage it in Blob
# Storage as a page blob, and register it as a managed image - the first disk
# as the boot image, the rest as data-disk images.

- name: Migrate a vSphere VM to Azure
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/migration-common.yml

  vars:
    migration_target: azure
    export_format: ovf
    resume_run_id: ""
    artifact_root: "/work/migrate-v2v"
    qemu_img_bin: qemu-img
    # Extra qemu-img convert arguments. -m keeps several coroutines in flight
    # and -W lets them write out of order, which a default single-threaded
    # conversion cannot do. Cache-mode flags such as "buffered" are the
    # qemu-img default and safe on every filesystem.
    azure_convert_args: ["-m", "16", "-W"]
    # Conversions run in the background so they can overlap the previous
    # disk's upload; these bound how long one may take.
    azure_convert_async_timeout: 86400
    azure_convert_poll_retries: 2880
    azure_convert_poll_delay: 30
    # Blob container the VHDs are staged in (an azure_projects entry may set
    # storage_container instead). Created when missing by the first upload.
    azure_storage_container: "migrate-v2v-images"
    # A same-named managed image is replaced so reruns publish the current
    # artifact; the resource ID is derived from the name, so it stays stable
    # across runs while its content changes - like GCP.
    azure_replace_existing_image: true
    azure_image_lookup_retries: 20
    azure_image_lookup_delay: 3
    # V1 (BIOS) or V2 (UEFI). Empty follows the source VM's firmware, read
    # from the artifact manifest; set V1 or V2 to override it.
    azure_hyper_v_generation: ""

  tasks:
    - name: Run shared VMware preflight checks
      ansible.builtin.import_tasks: tasks/migration/common/preflight.yml

    - name: Run Azure preflight checks
      ansible.builtin.import_tasks: tasks/migration/azure/preflight.yml

    - name: Initialize the Azure migration
      ansible.builtin.import_tasks: tasks/migration/azure/initialize.yml

    - name: Execute the Azure migration
      block:
        - name: Validate requested resume artifacts
          ansible.builtin.import_tasks: tasks/migration/common/resume.yml

        - name: Export and inspect the source VM
          ansible.builtin.import_tasks: tasks/migration/common/export-ova.yml
          when: not (migration_resume_mode | bool)

        - name: Prepare Azure disk artifacts
          ansible.builtin.import_tasks: tasks/migration/azure/prepare-disks.yml

        - name: Import disks into Azure
          ansible.builtin.import_tasks: tasks/migration/azure/import.yml

        - name: Build the Azure catalog entry
          ansible.builtin.import_tasks: tasks/migration/azure/build-catalog-entry.yml

        - name: Append the migration catalog entry
          ansible.builtin.import_tasks: tasks/migration/common/append-catalog.yml

      always:
        - name: Clean up Azure resources
          ansible.builtin.import_tasks: tasks/migration/azure/cleanup.yml

        - name: Clean up shared migration resources
          ansible.builtin.import_tasks: tasks/migration/common/cleanup.yml

