---
# requirements.yml
# vim: set tabstop=2 shiftwidth=2 expandtab:
#
# Installed via: ansible-galaxy collection install -r requirements.yml
# Pinned because module parameter names and return value shapes can change
# across collection releases; existing workflows are verified against these versions.
# Only collections a shipped workflow actually uses are listed, so
# tests/validate.sh requires exactly what this repository needs.
# community.vmware 5.10.0 is intentionally retained with ansible-core 2.18.
# The current 6.3.0 release requires ansible-core 2.19+ and its snapshot module
# is deprecated, so upgrade that pair together after migrating to vmware.vmware.

collections:
  - name: amazon.aws
    version: "11.4.0"
  - name: azure.azcollection
    version: "4.1.0"
  - name: community.vmware
    version: "5.10.0"
  - name: openstack.cloud
    version: "2.6.0"

# azure.azcollection carries its own Python SDK requirements (azure-identity,
# azure-mgmt-compute, azure-storage-blob, and friends) in the collection's
# requirements.txt. Install them into the same Python environment that runs
# Ansible, next to this file:
#
#   python3 -m pip install -r \
#     ~/.ansible/collections/ansible_collections/azure/azcollection/requirements.txt
#
# The Azure CLI is not used by any playbook; install it only if you want to
# inspect what the pipeline created by hand.
