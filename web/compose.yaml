services:
  controller:
    image: ${MIGRATE_V2V_RUNTIME_IMAGE:-migrate-v2v-runtime:ubuntu24.04-20261117}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: Dockerfile
    init: true
    working_dir: /opt/migrate-v2v
    command: ["python3", "web/app.py", "serve", "--host", "0.0.0.0", "--port", "8080"]
    user: "${HOST_UID:?Set HOST_UID}:${HOST_GID:?Set HOST_GID}"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      ARTIFACT_ROOT: /work/migrate-v2v
      LIBGUESTFS_PATH: ${LIBGUESTFS_PATH:-/tmp/libguestfs-appliance}
      MIGRATE_V2V_VAULT_DIR: /work/migrate-v2v/vaults
      MIGRATE_V2V_CATALOG_DIR: /work/migrate-v2v/catalogs
      VAULT_PASSWORD_FILE: /run/secrets/migrate-v2v-vault-password
      WEB_STATE_DIR: /work/migrate-v2v/web-state
      WEB_INPUT_DIR: ${WEB_INPUT_DIR:-/work/migrate-v2v/web-inputs}
      WEB_SECURE_COOKIE: "true"
      OVFTOOL_ACCEPT_LICENSE: ${OVFTOOL_ACCEPT_LICENSE:-1}
    volumes:
      - ${ARTIFACT_ROOT_HOST:?Set ARTIFACT_ROOT_HOST}:/work/migrate-v2v
      - ${ARTIFACT_ROOT_HOST:?Set ARTIFACT_ROOT_HOST}/vaults:/work/migrate-v2v/vaults:ro
      - ${VAULT_PASSWORD_FILE_HOST:?Set VAULT_PASSWORD_FILE_HOST}:/run/secrets/migrate-v2v-vault-password:ro
    networks: [private]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  https:
    # A fixed release, so a rebuild cannot pick up a new Caddy unreviewed.
    image: caddy:2.8.4
    # Caddy listens on 8443 inside the container, so it needs no
    # privileged port. Its upstream binary carries the NET_BIND_SERVICE file
    # capability, so retain that one capability in the bounding set for exec.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      controller:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    environment:
      CADDY_HOSTS: "localhost:8443, 127.0.0.1:8443"
      CADDY_DEFAULT_SNI: localhost
      CADDY_UPSTREAM: controller:8080
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "127.0.0.1:8443:8443"
    networks: [private]
    restart: unless-stopped

networks:
  private:

volumes:
  caddy-data:
  caddy-config:
