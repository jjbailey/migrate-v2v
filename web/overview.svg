  <title id="title">migrate-v2v controller overview</title>
  <desc id="desc">Dark teal controller page with a Move with clarity hero, migration and launch cards for AWS, Azure, Google Cloud, and OpenStack, and a recent jobs area.</desc>
  <defs>
    <radialGradient id="glow-a"><stop stop-color="#087e82" stop-opacity=".26"/><stop offset="1" stop-color="#087e82" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-b"><stop stop-color="#3978a8" stop-opacity=".16"/><stop offset="1" stop-color="#3978a8" stop-opacity="0"/></radialGradient>
