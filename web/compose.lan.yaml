services:
  https:
    environment:
      CADDY_HOSTS: "localhost:8443, 127.0.0.1:8443, ${WEB_ADDRESS:?Set WEB_ADDRESS to this controller's LAN IP}:8443"
    ports:
      - target: 8443
        published: "8443"
        host_ip: ${WEB_ADDRESS:?Set WEB_ADDRESS to this controller's LAN IP}
        protocol: tcp
