name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Install pinned Python requirements
        run: python -m pip install -r requirements.txt

      - name: Install pinned Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run repository validation gate
        run: ./tests/validate.sh
